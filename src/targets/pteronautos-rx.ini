# ------------------------- PTERONAUTOS RX TARGET -----------------
# PteronautOS -- Ornithopter Flight Firmware (forked from ExpressLRS)
# Specialized firmware for servo-driven ornithopters.
#
# Uses #ifndef ORNITHOPTER_MODE guards throughout rx_main.cpp to
# exclude serial protocols, analog/battery, baro, VTX, thermal.
# Core radio link, PWM output, LED, button, WiFi config: all kept.
#
# Extends ESP8285 RX (2.4GHz SX1280) -- the standard ELRS PWM receiver hardware.

[env_common_pteronautos_rx]
extends = env_common_8285rx, radio_SX128X
# Match scripts/flash.sh and the browser, including downloadable/OTA images.
board_build.f_flash = 40000000L
board_build.flash_mode = dout
build_flags =
    ${env_common_8285rx.build_flags}
    ${common_env_data.build_flags_rx}
    ${radio_SX128X.build_flags}
    -D PTERONAUTOS=1
    -D ORNITHOPTER_MODE=1
    #-D DEBUG_LOG=1
    # Gyro stabilization is compile-time. Remove (or comment) ZEPHYRUS_ENABLED
    # to build WITHOUT the MPU6050/AHRS/PID module entirely — the WebUI
    # Zephyrus panel then grays out ("Not compiled"). All firmware guards use
    # #ifdef, so do NOT set it to 0; DELETE the line to disable.
    -D ZEPHYRUS_ENABLED=1
    -D ZEPHYR_I2C_SDA=1
    -D ZEPHYR_I2C_SCL=3
    -D AUTO_WIFI_ON_INTERVAL=60
    # Standalone PWM receiver. For EP2 + RP2040 use the dedicated EP2
    # environment below: UART0 replaces local PWM and the ESP-side gyro.
    -include target/Unified_ESP_RX.h
    -Ilib/Ornithopter
    -Ilib/Zephyrus
    -Ilib/Mushin
build_src_filter =
    ${env_common_esp82xx.build_src_filter}
    -<tx_*.cpp> -<tx-*/>

[env:PteronautOS_ESP8285_2400_RX]
extends = env_common_pteronautos_rx

# EP1/EP2 + RP2040: UART0 is runtime transport AND ROM programming port.
# No receiver-side PWM or gyro/I2C on the UART pins.
[env:PteronautOS_ESP8285_EP2_2400_RX]
extends = env_common_8285rx, radio_SX128X
board_build.f_flash = 40000000L
board_build.flash_mode = dout
build_flags =
    ${env_common_8285rx.build_flags}
    ${common_env_data.build_flags_rx}
    ${radio_SX128X.build_flags}
    -D PTERONAUTOS=1
    -D ORNITHOPTER_MODE=1
    -D MUSHIN_ENABLED=1
    -Ilib/Ornithopter
    -Ilib/Zephyrus
    -Ilib/Mushin
build_src_filter =
    ${env_common_esp82xx.build_src_filter}
    -<tx_*.cpp> -<tx-*/>

# ─── Gearbox variant: GEARBOX_1MOT_2VTAIL_1RUD (head rudder, motor, 2× V-tail) ───
[env:PteronautOS_ESP8285_2400_RX_GEARBOX]
extends = env_common_pteronautos_rx
build_flags =
    ${env_common_pteronautos_rx.build_flags}
    -D MIXER_PROFILE=5