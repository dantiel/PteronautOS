# ------------------------- PTERONAUTOS RX TARGET -----------------
# PteronautOS -- Ornithopter Flight Firmware (forked from ExpressLRS)
# Specialized firmware for servo-driven ornithopters.
#
# Uses #ifndef ORNITHOPTER_MODE guards throughout rx_main.cpp to
# exclude serial protocols, analog/battery, baro, VTX, thermal.
# Core radio link, PWM output, LED, button, WiFi config: all kept.
#
# Extends ESP8285 RX (2.4GHz SX1280) -- the standard ELRS PWM receiver hardware.

[env_common_pteronautos_rx]
extends = env_common_8285rx, radio_SX128X
build_flags =
    ${env_common_8285rx.build_flags}
    ${common_env_data.build_flags_rx}
    ${radio_SX128X.build_flags}
    -D PTERONAUTOS=1
    -D ORNITHOPTER_MODE=1
    #-D DEBUG_LOG=1
    -D ZEPHYRUS_ENABLED=1
    -D ZEPHYR_I2C_SDA=1
    -D ZEPHYR_I2C_SCL=3
    -D AUTO_WIFI_ON_INTERVAL=60
    # MushinNoShin (MUSHIN bridge) — the spirit's half of the YOSHIMITSU link.
    # OFF by default: the standalone PWM-receiver build flaps its own wings.
    # Enable only when consciously compiling for an RP2040 muscle (e.g. EP2),
    # where the muscle owns the servos and the spirit streams intents instead
    # of driving local PWM.
    #
    # Mutual exclusion is enforced in code: when MUSHIN_ENABLED is set,
    # devServoOutput.cpp excludes MUSHIN_RX_PIN/MUSHIN_TX_PIN (GPIO9/GPIO10,
    # the CH4/CH5 wing pins) from PWM allocation, so the bridge serial and the
    # wing PWM can never fight over the same GPIO — by design, not convention.
    #-D MUSHIN_ENABLED=1
    #-D MUSHIN_RX_PIN=9
    #-D MUSHIN_TX_PIN=10
    #-D MUSHIN_BAUD=57600
    -include target/Unified_ESP_RX.h
    -Ilib/Ornithopter
    -Ilib/Zephyrus
    -Ilib/Mushin
build_src_filter =
    ${env_common_esp82xx.build_src_filter}
    -<tx_*.cpp> -<tx-*/>

[env:PteronautOS_ESP8285_2400_RX]
extends = env_common_pteronautos_rx

# ─── Gearbox variant: GEARBOX_1MOT_2VTAIL_1RUD (head rudder, motor, 2× V-tail) ───
[env:PteronautOS_ESP8285_2400_RX_GEARBOX]
extends = env_common_pteronautos_rx
build_flags =
    ${env_common_pteronautos_rx.build_flags}
    -D MIXER_PROFILE=5