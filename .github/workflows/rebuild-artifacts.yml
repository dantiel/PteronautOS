name: Rebuild WebUI Artifacts

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: rebuild-webui-artifacts
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.20.2'

      - name: Install dependencies
        run: |
          cd src/html
          npm ci

      - name: Build Web UI
        run: |
          cd src/html
          rm -rf headers
          cp -r out headers
          npm run build:all

      - name: Verify reproducible artifacts
        run: |
          cd src/html
          diff -qr out headers

      - name: Commit updated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/html/headers/*.h
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rebuild WebUI artifacts"
            git push
          fi