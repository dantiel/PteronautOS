name: Rebuild WebUI Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (all or pteronautos)'
        required: false
        default: 'pteronautos'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd src/html
          npm ci

      - name: Build Web UI
        run: |
          cd src/html
          if [ "${{ github.event.inputs.target }}" = "all" ]; then
            npm run build:all
          else
            npm run build:pteronautos
          fi

      - name: Commit updated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/html/headers/*.h
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rebuild WebUI artifacts [skip ci]"
            git push
          fi
