title: "Feature / Idea"
body:
  - type: markdown
    attributes:
      value: |
        💡 Share ideas for new features — waveforms, mixer profiles, gyro behaviour, WebUI, tooling.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: Describe the feature or improvement.
      placeholder: "A new waveform shape that…"
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Why it matters
      description: What problem does it solve, or what flight behaviour would it enable?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Waveform / oscillator
        - Mixer / channels
        - Zephyrus (gyro / PID)
        - WebUI / i18n
        - Tooling / build
        - Hardware / target
        - Documentation
        - Other
    validations:
      required: false
