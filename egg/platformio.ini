; Pteronaut-Egg — minimal WiFi bootstrap for the ESP8285 (1MB).
; A tiny firmware whose ONLY job is to accept a full PteronautOS image over
; WiFi (AP mode + raw TCP) and stage it via ESP8266 Updater (U_FLASH).
;
; It is NOT ELRS. It has no CRSF, no WebUI, no ArduinoJson, no littlefs.
; It must stay <= ~320 KB so the full (~636 KB) image fits in freeSketchSpace,
; and the full image's own WebUI can flash the egg back — closing the cycle.

[env:egg]
platform = espressif8266@4.2.1
board = esp8285
framework = arduino
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dout
board_build.ldscript = elrs.flash.1m.ld
monitor_speed = 115200
build_flags =
    -DNDEBUG
    ; LWIP2 low-memory/low-flash variant — smallest networking footprint.
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH